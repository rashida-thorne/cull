[package]
name = "cull"
version = "0.6.0"
edition = "2024"
description = "jq for HTML: select with CSS selectors, shape into JSON, CSV, or Markdown"
license = "MIT"
repository = "https://github.com/rashida-thorne/cull"
readme = "README.md"
keywords = ["html", "css-selector", "scraping", "cli", "markdown"]
categories = ["command-line-utilities", "parsing", "web-programming"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.7"
clap_mangen = "0.3.0"
ego-tree = "0.11"
encoding_rs = "0.8.35"
scraper = "0.27.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "gzip"], optional = true }

[features]
# `fetch` enables built-in http(s):// input fetching (ureq + rustls).
# On by default; disabled by the WASM playground build, which has no sockets.
default = ["fetch"]
fetch = ["dep:ureq"]

[dev-dependencies]
serde_json = "1.0.151"

[profile.release]
lto = true
strip = true
codegen-units = 1

[target."cfg(unix)".dependencies]
libc = "0.2.189"
