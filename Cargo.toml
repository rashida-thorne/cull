[package]
name = "cull"
version = "0.1.0"
edition = "2024"
description = "jq for HTML: select with CSS selectors, shape into JSON, CSV, or Markdown"
license = "MIT"
repository = "https://github.com/rashidathorne/cull"
readme = "README.md"
keywords = ["html", "css-selector", "scraping", "cli", "markdown"]
categories = ["command-line-utilities", "parsing", "web-programming"]

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
ego-tree = "0.11"
scraper = "0.27.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
serde_json = "1.0.151"

[profile.release]
lto = true
strip = true
codegen-units = 1
